<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="A small figure looking up at a ladder leaning against a giant question mark">
  <g fill="none" stroke="#221c17" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- ground -->
    <path d="M40 348h720" stroke-width="4"/>
  </g>

  <!-- giant question mark, drawn as an open stroke -->
  <g fill="none" stroke="#c4622d" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <path d="M452 96c0-38 28-62 64-62s64 22 64 58c0 30-20 42-40 56-14 10-20 20-20 36v18"/>
    <path d="M520 246h.01"/>
  </g>

  <!-- ladder leaning on the question mark -->
  <g fill="none" stroke="#221c17" stroke-width="5" stroke-linecap="round">
    <path d="M196 344 330 118"/>
    <path d="M244 344 378 118"/>
    <path d="M214 300h78M232 266h78M250 232h78M268 198h78M286 164h78M304 130h74"/>
  </g>

  <!-- small figure, arm raised -->
  <g fill="none" stroke="#3e5c9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="128" cy="238" r="20"/>
    <path d="M128 258v56M128 272l-26 22M128 272l26-26M128 314l-20 30M128 314l20 30"/>
  </g>

  <!-- thought trail -->
  <g fill="none" stroke="#c4622d" stroke-width="3.5" stroke-linecap="round" opacity="0.75">
    <path d="M170 214c14-14 30-16 44-8" stroke-dasharray="7 10"/>
    <path d="M226 196c16-10 32-8 44 2" stroke-dasharray="7 10"/>
  </g>

  <!-- stars -->
  <g fill="#3e5c9a" opacity="0.8">
    <path d="M640 84l5 12 12 5-12 5-5 12-5-12-12-5 12-5z"/>
    <path d="M712 190l4 9 9 4-9 4-4 9-4-9-9-4 9-4z"/>
    <path d="M600 300l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
    <path d="M86 132l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
  </g>
</svg>
